<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1e1e28"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#a78b4a"/>
    </linearGradient>
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.7"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#a78b4a" stroke-width="1.5" opacity="0.3"/>

  <!-- Inner decorative ring with notches -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#a78b4a" stroke-width="1" opacity="0.2"/>

  <!-- Compass cardinal marks -->
  <line x1="256" y1="26" x2="256" y2="56" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="256" y1="456" x2="256" y2="486" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="26" y1="256" x2="56" y2="256" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="456" y1="256" x2="486" y2="256" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- Winding path - the "there and back" journey -->
  <path
    d="M 256 380
       C 200 360, 160 320, 170 270
       C 180 220, 220 200, 256 180
       C 292 160, 340 140, 340 110
       C 340 90, 310 80, 280 85"
    fill="none"
    stroke="#a78b4a"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.3"
  />
  <path
    d="M 256 380
       C 200 360, 160 320, 170 270
       C 180 220, 220 200, 256 180
       C 292 160, 340 140, 340 110
       C 340 90, 310 80, 280 85"
    fill="none"
    stroke="url(#gold)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="12 8"
    opacity="0.8"
  />

  <!-- Return path (dotted, slightly offset) -->
  <path
    d="M 280 85
       C 250 90, 220 100, 200 130
       C 175 170, 190 210, 220 240
       C 250 270, 300 300, 310 340
       C 315 360, 290 375, 256 380"
    fill="none"
    stroke="url(#gold)"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="6 10"
    opacity="0.5"
  />

  <!-- Start/end marker (home) -->
  <circle cx="256" cy="380" r="14" fill="#14141a" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="256" cy="380" r="6" fill="url(#gold)" opacity="0.8"/>

  <!-- Destination star at the top -->
  <g filter="url(#starGlow)" transform="translate(270, 80)">
    <polygon
      points="0,-20 5,-7 19,-7 8,3 12,17 0,9 -12,17 -8,3 -19,-7 -5,-7"
      fill="url(#goldBright)"
      opacity="0.95"
    />
  </g>

  <!-- Mountains silhouette in background -->
  <path
    d="M 100 300 L 170 200 L 210 260 L 260 170 L 310 250 L 350 190 L 410 300"
    fill="none"
    stroke="#2a2a35"
    stroke-width="3"
    stroke-linejoin="round"
    opacity="0.4"
  />
</svg>
